<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Chart.js loaded from CDN (used for the pie chart) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Application behavior; deferred so it runs after the DOM is parsed -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app">
    <!-- 1. Balance_Display (top-most, Requirement 7.1 / 4.x) -->
    <header class="balance-display" aria-label="Total balance">
      <h1 class="balance-display__heading">Total Balance</h1>
      <p id="balance" class="balance-display__amount" aria-live="polite">0.00</p>
      <p id="balance-warning" class="balance-display__warning" role="alert" hidden>
        Balance is out of range; showing last valid total.
      </p>
    </header>

    <!-- 2. Input_Form (Requirement 1.x) -->
    <section class="input-form" aria-labelledby="input-form-heading">
      <h2 id="input-form-heading">Add Transaction</h2>
      <form id="tx-form" novalidate>
        <div class="field">
          <label for="name">Item name</label>
          <input
            type="text"
            id="name"
            name="name"
            maxlength="50"
            autocomplete="off"
            aria-describedby="name-error"
          />
          <p id="name-error" class="field__error" role="alert" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            inputmode="decimal"
            aria-describedby="amount-error"
          />
          <p id="amount-error" class="field__error" role="alert" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" aria-describedby="category-error">
            <option value="" selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <p id="category-error" class="field__error" role="alert" aria-live="polite"></p>
        </div>

        <button type="submit" class="input-form__submit">Add</button>
      </form>
    </section>

    <!-- 3. Transaction_List (Requirement 2.x / 3.x) -->
    <section class="transaction-list" aria-labelledby="transaction-list-heading">
      <h2 id="transaction-list-heading">Transactions</h2>
      <p id="list-error" class="transaction-list__error" role="alert" aria-live="polite" hidden></p>
      <ul id="tx-list" class="transaction-list__items" aria-label="Recorded transactions"></ul>
      <p id="empty-state" class="transaction-list__empty">No transactions yet.</p>
    </section>

    <!-- 4. Pie_Chart (Requirement 5.x) -->
    <section class="pie-chart" aria-labelledby="pie-chart-heading">
      <h2 id="pie-chart-heading">Spending by Category</h2>
      <canvas id="pie" role="img" aria-label="Pie chart of spending by category"></canvas>
      <p id="chart-empty" class="pie-chart__empty">No spending data to display.</p>
    </section>
  </main>
</body>
</html>
